name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages: '' is load-bearing, not tidiness. The action's own default
      # for this input is "tools platform-tools", and Google removed the
      # obsolete "tools" package from the SDK repository on 2026-09-14.
      # Current sdkmanager builds exit 1 on an unknown package instead of
      # warning and carrying on, so a bare `uses:` here fails the job about
      # twenty seconds in, before any of our code is touched:
      #
      #     Warning: Failed to find package 'tools'
      #     Error: The process '.../sdkmanager' failed with exit code 1
      #
      # Bumping the action does not help -- v4 declares the same default.
      # Empty means the action still creates ANDROID_HOME, accepts the
      # licenses and puts sdkmanager on PATH; it just installs nothing, which
      # costs us nothing because the next step names everything this build
      # actually needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Provisions Gradle 8.7 itself (matches the Android Gradle Plugin
      # version used in build.gradle) and puts it on PATH -- this project
      # deliberately has NO checked-in gradlew, so this step is what
      # actually gives us a `gradle` command to run.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navbridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
