name: Release APK

# Builds the exact same debug APK build.yml does on every push (this project
# ships an unsigned debug build BY DESIGN -- see README's "Ограничения"
# section: no release signing key is set up, this is for personal use) and
# publishes it as a downloadable asset on a proper GitHub Release, instead of
# a CI artifact you have to dig into the Actions tab (and be logged in) to
# find. build.yml is untouched and keeps doing its own thing on every push to
# main -- this is a separate, ADDITIONAL workflow that only runs when you
# actually want to cut a release.
#
# How to use:
#   git tag v1.0.0
#   git push origin v1.0.0
# ...and this creates a GitHub Release named "NavBridge v1.0.0" with
# NavBridge-v1.0.0.apk attached, plus auto-generated release notes (the list of
# commits since the previous tag).
#
# Can also be run by hand from the Actions tab ("Run workflow") without
# pushing a new tag -- e.g. to re-publish a release after fixing something
# about the release itself, not the app. When run this way, pick the tag to
# build from the "Use workflow from" branch/tag dropdown (or fill in the
# "tag" input below if that's not convenient) -- there has to be an existing
# tag either way, this workflow doesn't create one for you.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (leave empty to use whatever tag/branch this run was started from)'
        required: false

# Default GITHUB_TOKEN is read-only unless a job/workflow explicitly asks for
# more -- "gh release create" below needs write access to create the release
# and upload its asset.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Запрашиваем всю историю (fetch-depth: 0), чтобы корректно работало 
      # удаление/создание тегов и генерация заметок релиза.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            echo "::error::No tag to release. Push a tag (git tag v1.0.0 && git push origin v1.0.0), or when running this by hand pick a tag from 'Use workflow from', or fill in the 'tag' input." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Пересоздаем тег на сервере только при ручном запуске (workflow_dispatch).
      # Это заставит GitHub пересобрать архивы исходного кода (Source code zip) из нового состояния кода.
      - name: Force update git tag (on manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Безопасно удаляем тег локально и удаленно, если он уже существовал
          git tag -d "$TAG" || true
          git push origin :refs/tags/"$TAG" || true
          
          # Создаем тег заново на текущем коммите и принудительно отправляем в репозиторий
          git tag "$TAG"
          git push origin "$TAG" --force

      # Same build steps as build.yml -- see that file for why each one is
      # here (no checked-in gradlew, so setup-gradle is what actually
      # provides a `gradle` command; SDK packages installed explicitly since
      # setup-android alone doesn't fetch platform/build-tools).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages: '' -- see build.yml for why. Short version: the action's
      # default installs the "tools" package, which Google has removed, and
      # sdkmanager now exits 1 on it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # -P hands the tag to build.gradle's resolveVersionName, which strips
      # the leading "v". Without it the APK reports whatever
      # navBridgeVersionName happens to say in gradle.properties, which is a
      # hand-edited line and therefore the one thing in this pipeline that can
      # silently fall behind -- an APK downloaded as NavBridge-v1.0.7.apk
      # showing 1.0.6 on the About screen. app/build.gradle's comment already
      # describes this override as the reason a published APK cannot disagree
      # with its own download name; this is the flag that was supposed to make
      # that true.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PnavBridgeVersionName="${{ steps.tag.outputs.tag }}"

      - name: Rename APK to include the version
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/NavBridge-${{ steps.tag.outputs.tag }}.apk"

      # `gh` is preinstalled on GitHub-hosted runners -- no third-party
      # action needed just to create a release. --generate-notes asks GitHub
      # to write the notes itself (commit list since the previous release),
      # same as clicking "Generate release notes" in the web UI.
      #
      # Two commands, not one, because --clobber belongs to `gh release
      # upload` and does not exist on `gh release create` -- passing it there
      # fails with "unknown flag: --clobber" before anything is published.
      # `create` also refuses outright when the release already exists, which
      # is exactly the re-publish case the manual run is for, so the two cases
      # have to be told apart up front:
      #
      #   release absent  -> create it, with the APK and generated notes
      #   release present -> upload the APK over the old one (--clobber)
      #
      # Note what the second branch does NOT do: regenerate the release notes.
      # `gh release upload` only touches assets. That is usually what you
      # want on a re-publish (the commits have not changed, only the build
      # has); when it is not, delete the release in the web UI and run this
      # again, and it will take the create path.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          APK="release/NavBridge-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists -- replacing its APK."
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "Release $TAG does not exist yet -- creating it."
            gh release create "$TAG" "$APK" \
              --title "NavBridge $TAG" \
              --generate-notes
          fi
