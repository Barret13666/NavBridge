name: Release APK

# Builds the exact same debug APK build.yml does on every push (this project
# ships an unsigned debug build BY DESIGN -- see README's "Ограничения"
# section: no release signing key is set up, this is for personal use) and
# publishes it as a downloadable asset on a proper GitHub Release, instead of
# a CI artifact you have to dig into the Actions tab (and be logged in) to
# find. build.yml is untouched and keeps doing its own thing on every push to
# main -- this is a separate, ADDITIONAL workflow that only runs when you
# actually want to cut a release.
#
# How to use:
#   git tag v1.0.0
#   git push origin v1.0.0
# ...and this creates a GitHub Release named "NavBridge v1.0.0" with
# NavBridge-v1.0.0.apk attached, plus auto-generated release notes (the list of
# commits since the previous tag).
#
# Re-running for a tag that already has a release is fine: the old release and
# the old tag are both removed, the tag is recreated at the commit this run
# built, and a fresh release is published on it. Nothing stale survives --
# neither an APK from the previous build nor a cached source archive from
# before the tag was moved.
#
# Can also be run by hand from the Actions tab ("Run workflow") without
# pushing a new tag -- e.g. to re-publish a release after fixing something
# about the release itself, not the app. When run this way, pick the tag to
# build from the "Use workflow from" branch/tag dropdown (or fill in the
# "tag" input below if that's not convenient) -- there has to be an existing
# tag either way, this workflow doesn't create one for you.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (leave empty to use whatever tag/branch this run was started from)'
        required: false

# Default GITHUB_TOKEN is read-only unless a job/workflow explicitly asks for
# more -- "gh release create" below needs write access to create the release
# and upload its asset.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            echo "::error::No tag to release. Push a tag (git tag v1.0.0 && git push origin v1.0.0), or when running this by hand pick a tag from 'Use workflow from', or fill in the 'tag' input." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Same build steps as build.yml -- see that file for why each one is
      # here (no checked-in gradlew, so setup-gradle is what actually
      # provides a `gradle` command; SDK packages installed explicitly since
      # setup-android alone doesn't fetch platform/build-tools).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # gradle.properties carries the version for every other kind of build;
      # here the tag overrides it, so the number inside the APK is the same
      # string used to name the file and the release below and cannot end up
      # disagreeing with the download button.
      #
      # The check is separate from the override on purpose: overriding alone
      # would let gradle.properties quietly rot, and then every local and
      # every debug build would report a version that has not been true for
      # months. A warning rather than a failure -- the release itself is
      # correct either way, and stopping a release over a bookkeeping slip
      # would be the wrong trade at the moment you are trying to ship.
      - name: Check the declared version matches the tag
        run: |
          DECLARED=$(sed -n 's/^navBridgeVersionName=//p' gradle.properties | tr -d '[:space:]')
          EXPECTED="${{ steps.tag.outputs.tag }}"
          EXPECTED="${EXPECTED#v}"
          if [ "$DECLARED" != "$EXPECTED" ]; then
            echo "::warning::gradle.properties says navBridgeVersionName=$DECLARED but this release is $EXPECTED. The APK will say $EXPECTED; please bump gradle.properties so local and debug builds agree."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PnavBridgeVersionName=${{ steps.tag.outputs.tag }}

      - name: Rename APK to include the version
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/NavBridge-${{ steps.tag.outputs.tag }}.apk"

      # `gh` is preinstalled on GitHub-hosted runners -- no third-party
      # action needed just to create a release. --generate-notes asks GitHub
      # to write the notes itself (commit list since the previous release),
      # same as clicking "Generate release notes" in the web UI.
      #
      # A NEW TAG STILL TAKES THE SIMPLE PATH: the `else` branch below is the
      # original behaviour, untouched. Everything above it only runs when a
      # release for this tag already exists.
      #
      # RE-RELEASING AN EXISTING TAG. `gh release create` fails outright if
      # the release is already there, which is exactly the case when you fix
      # something and push the tag again. The release AND the tag are deleted
      # and both are recreated from the commit this run checked out.
      #
      # Deleting the tag as well is the part that matters, and it is worth
      # spelling out why. Asset files could be cleared without it, but
      # "Source code (zip)" and "Source code (tar.gz)" are not assets: GitHub
      # builds them from the tag and CACHES them per tag name. Move a tag to a
      # new commit and those two links can keep serving the old snapshot for
      # some time, so the APK on the page and the source next to it disagree
      # about what was built. Removing the tag drops that cache; recreating it
      # at the same commit brings the links back pointing at the right tree.
      #
      # --cleanup-tag does both deletions in one step. Recreating the tag from
      # a workflow does not re-trigger this workflow: pushes made with
      # GITHUB_TOKEN deliberately do not fire further workflow runs, so there
      # is no loop here.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          APK="release/NavBridge-$TAG.apk"
          SHA="${{ github.sha }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists -- removing it and its tag, then rebuilding both."

            # Deletes the release and the tag together. The tag is put back
            # immediately below, at the same commit, so nothing is lost.
            gh release delete "$TAG" --yes --cleanup-tag

            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$SHA"
            git push --force origin "refs/tags/$TAG"
          fi

          gh release create "$TAG" "$APK" \
            --title "NavBridge $TAG" \
            --generate-notes
