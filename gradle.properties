org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app version, and the single place it is written down.
#
# Bump this in the same commit you tag:
#     (edit to 1.0.6) -> commit -> git tag v1.0.6 -> git push origin v1.0.6
#
# release.yml overrides it with the tag anyway, so a published APK can never
# disagree with its own download name -- but it also warns when this file has
# been left behind, because the repository should say what it shipped.
navBridgeVersionName=1.0.5
