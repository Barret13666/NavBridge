plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// Version
// ---------------------------------------------------------------------------
//
// Declared in gradle.properties as navBridgeVersionName, and overridable on
// the command line with -PnavBridgeVersionName=... which is how release.yml
// hands it the tag it is building.
//
// An earlier attempt derived this from `git describe` instead, so that the
// number could not possibly drift from the tag. It drifted the other way: the
// APK reported v8bb1a11, a bare commit hash, because `describe` falls back to
// --always when it can find no tags, and there are several ordinary ways for
// that to happen -- a shallow CI checkout (the default fetches no tags at
// all), a build from a source zip, an Android Studio build on a clone that
// was never tagged. Trading "might be stale" for "is frequently a hash" was a
// bad trade: a stale number is at least a number.
//
// So the repository states its own version, one line, in one obvious file,
// and nothing about the build environment can take it away. release.yml still
// passes the tag on top, so a published APK matches its download name by
// construction, and it warns when the two disagree so the file gets bumped.
def resolveVersionName = { ->
    def declared = project.findProperty('navBridgeVersionName')
    if (!declared) return '0.0.0-dev'
    return declared.toString().trim().replaceFirst(/^v/, '')
}

// versionCode has to be a single increasing integer, so the three parts are
// packed as major*10000 + minor*100 + patch. That keeps ordering correct for
// anything up to x.99.99 and, unlike a build counter, gives the same number
// for the same version no matter where it is built.
def resolveVersionCode = { String name ->
    def matcher = (name =~ /^(\d+)\.(\d+)(?:\.(\d+))?/)
    if (!matcher.find()) return 1
    def major = matcher.group(1).toInteger()
    def minor = matcher.group(2).toInteger()
    def patch = (matcher.group(3) ?: '0').toInteger()
    return major * 10000 + minor * 100 + patch
}

def navBridgeVersionName = resolveVersionName()

android {
    namespace 'com.barret.navbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.barret.navbridge"
        minSdk 24
        targetSdk 34
        versionCode resolveVersionCode(navBridgeVersionName)
        versionName navBridgeVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        aidl true // needed to compile app/src/main/aidl/btools/routingapp/IBRouterService.aidl
                   // (BRouter's published client interface -- see BRouterClient.kt)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
